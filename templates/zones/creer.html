{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-plus-circle"></i> Créer une Nouvelle Zone</h2>
    
    <div class="card mt-4">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nom de la Zone *</label>
                    <input type="text" name="nom" class="form-control" placeholder="Ex: A320 DAHER" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Description de la zone..."></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check"></i> Créer la Zone
                    </button>
                    <a href="{{ url_for('liste_zones') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
